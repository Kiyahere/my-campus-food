<!DOCTYPE html>
<html>
<head>
    <title>Cart</title>
</head>
<body>

<h1>Your Cart</h1>

{% for item in cart %}
    <p>{{ item.name }} - ₦{{ item.price }}
        <a href="/delete-cart/{{ item.id }}">
            <button style="background:red; color:white;"> Delete</button>
        </a>
    </p>
{% endfor %}

<h3>Total: ₦{{ total }}</h3>

<a href="/pay">
    <button style="background:green; color:white;">
        Checkout with Paystack
    </button>
</a>

</body>
</html>
