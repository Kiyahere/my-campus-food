<!DOCTYPE html>
<html>
<head>
    <title>Menu</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="font-family:Arial; text-align:center;">

    <h1>🍽️Food Menu</h1>

    <a href="/">Home</a> | 
    <a href="/logout">Logout</a>

    <hr>

    <div class="menu">
        {% for food in foods %}
        <div class="food-card">
        <img src="{{ url_for('static', filename='uploads/' + food.imageS) }}" width="150">

        <h3>{{ food['name'] }}</h3>
        <p>₦{{ food['price'] }}</p>

        <a href="/add-to-cart/{{ food['id'] }}">
            <button>Add to Cart</button>
        </a>
        </div>
      {% endfor %}

      <a href="/cart">View Cart</a>|
      <a href="/orders">Track Orders</a>@
    </div>
</body>
</html>
