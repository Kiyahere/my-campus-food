<!DOCTYPE html>
<html>

    <title>Sign Up</title>
</head>
<body style="font-family:Arial; text-align:center;">

<h2>Student Sign Up</h2>

</form>

<br>
<a href="/login">Already have an account? Login</a>

</body>
</html>
