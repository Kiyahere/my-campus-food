<h2>All Foods</h2>

<a href="/admin_dashboard">Back</a>

<ul>
{% for food in foods %}
    <li>
        <h3>{{ food["name"] }}</h3>
        <p>₦{{ food["price"] }}</p>
        <img src="{{ url_for('static', filename=food['image']) }}" width="120">

        <br>
        <a href="/delete_food/{{ food['id'] }}">Delete</a>
    </li>
{% endfor %}
</ul>
